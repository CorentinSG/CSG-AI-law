name: Discover source feeds

# Manual only. Probes the seeded sources that still extract with a bare anchor
# selector and reports which of them publish a real RSS/Atom feed. It reads
# nothing from Supabase and writes nothing anywhere — the output is a report
# uploaded as an artifact, so a feed URL is never guessed before being wired in.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of sources to probe (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe sources for real feeds
        env:
          # The script only reads the TS seed, but env validation runs on import.
          APP_DATA_MODE: memory
          ALLOW_MEMORY_MODE_IN_PRODUCTION: "true"
          LIMIT: ${{ inputs.limit }}
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          export ADMIN_AUTH_SECRET="$secret"
          if [ -n "$LIMIT" ]; then
            npx tsx scripts/discover-source-feeds.ts --limit "$LIMIT" --json feed-discovery.json
          else
            npx tsx scripts/discover-source-feeds.ts --json feed-discovery.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-discovery
          path: feed-discovery.json
          if-no-files-found: warn
